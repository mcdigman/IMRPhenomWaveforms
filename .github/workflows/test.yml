name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.15"

permissions:
  contents: read

jobs:
  pytest:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install project with test extras
        run: |
          uv venv
          uv pip install ".[dev]"

      # Run the test suite.
      - name: Run tests
        run: .venv/bin/python -m pytest

  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          python-version: "3.11"
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install project (lowest-direct resolution)
        run: |
          uv venv --python 3.11
          uv pip install --resolution lowest-direct .
          uv pip install pytest pyyaml

      - name: Run tests
        run: .venv/bin/python -m pytest

  matrix:
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each supported Python against the latest resolvable numpy/numba.
          - python-version: "3.11"
            resolution: highest
          - python-version: "3.12"
            resolution: highest
          - python-version: "3.13"
            resolution: highest
          - python-version: "3.14"
            resolution: highest
          - python-version: "3.15"
            resolution: highest
    name: py${{ matrix.python-version }} (${{ matrix.resolution }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install project (${{ matrix.resolution }} resolution)
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --resolution ${{ matrix.resolution }} .
          uv pip install pytest pyyaml

      - name: Run tests
        run: .venv/bin/python -m pytest
