name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  # Minimum combined line+branch coverage (coverage.py's --fail-under compares the
  # total, which reaches 100 only when both line and branch coverage are complete).
  # main requires a perfect gate; dev (and any other branch) allows some slack so
  # in-progress work can land, with the remaining gap closed before promotion.
  MAIN_COVERAGE: "100"
  DEV_COVERAGE: "95"

# All jobs only read the repo; none need a writable GITHUB_TOKEN, so pin the
# default token to read-only.
permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install project with coverage
        run: |
          uv venv
          uv pip install ".[dev]" coverage

      - name: Run tests under coverage
        run: .venv/bin/python -m coverage run --branch --source=IMRPhenomWaveforms,scripts' -m pytest

      - name: Coverage report
        env:
          TARGET_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          target="${TARGET_REF}"
          if [ "$target" = "main" ]; then
            thresh="${MAIN_COVERAGE}"
          else
            thresh="${DEV_COVERAGE}"
          fi
          echo "Coverage gate for '${target}': ${thresh}%"
          .venv/bin/python -m coverage report -m --fail-under="${thresh}"

      - name: Generate coverage artifacts
        if: ${{ !cancelled() }}
        run: |
          .venv/bin/python -m coverage xml
          .venv/bin/python -m coverage html

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329  # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          format: cobertura
          fail-on-error: false
          coverage-reporter-version: v0.6.17

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
