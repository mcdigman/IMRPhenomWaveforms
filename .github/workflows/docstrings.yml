name: Docstrings

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docstrings-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  PYDOCLINT_VERSION: "0.8.7"

permissions:
  contents: read

jobs:
  pydoclint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: "**/pyproject.toml"

      # numpy-style docstring/signature linting. Options come from [tool.pydoclint] in pyproject.toml.
      - name: Run pydoclint
        run: >
          uvx "pydoclint@${{ env.PYDOCLINT_VERSION }}"
          IMRPhenomWaveforms scripts
