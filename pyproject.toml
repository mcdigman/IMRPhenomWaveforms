[project]
name = "IMRPhenomWaveforms"
version = "0.0.1"
description = "Open source IMRPhenom class python waveforms"
readme = "README.md"
authors = [
  { name="Matthew C. Digman", email="matthew.digman@vanderbilt.edu" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
keywords = [
    "numba",
    "njit",
    "scientific computing",
    "gravitational waves",
    "LISA",
]
# NumPy 1.23.5 and Numba 0.57 provide a compatible floor pair with Python 3.11
# wheels; Numba 0.56 does not support Python 3.11.
dependencies = [
    "numpy>=1.23.5",
    "numba>=0.57",
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/mcdigman/IMRPhenomWaveforms"
Repository = "https://github.com/mcdigman/IMRPhenomWaveforms"
Issues = "https://github.com/mcdigman/IMRPhenomWaveforms/issues"
Changelog = "https://github.com/mcdigman/IMRPhenomWaveforms/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff",
    "mypy",
    "pyright",
    "pyrefly",
    "prek",
]

[tool.pyright]
pythonVersion = "3.11"
reportMissingImports = "none"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "build"]

[tool.mypy]
strict = true
exclude = ['^build/', '^\.venv/']

[tool.pydoclint]
style = "numpy"
check-return-types = true
check-class-attributes = true
allow-init-docstring = true
exclude = '\.git|\.tox|\.venv|\.eggs|_build|buck-out|build|dist|__pycache__|\.mypy_cache|\.pytest_cache|\.ruff_cache'

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["IMRPhenomWaveforms*"]
